name: Gerar Estatisticas de Perfil

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: stats.svg
          output_action: commit
          committer_branch: stats-output
          plugin_islands: yes
          config_timezone: America/Sao_Paulo

      - name: Generate Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: languages.svg
          output_action: commit
          committer_branch: languages-output
          plugin_languages: yes
          plugin_languages_details: percentage, compact-data
          config_timezone: America/Sao_Paulo

      - name: Generate Activity Graph
        uses: ashutosh00710/github-readme-activity-graph@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_branch: activity-graph-output
